[package]
name = "lyricsflip-nft"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
upgrade-fixture = { path = "../upgrade-fixture" }

[features]
testutils = ["soroban-sdk/testutils"]
